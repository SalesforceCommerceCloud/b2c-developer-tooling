site_name: Salesforce B2C Tooling SDK (Python)
site_description: >-
  Python SDK for Salesforce B2C Commerce tooling — authentication, configuration
  resolution, typed OCAPI/SCAPI clients, WebDAV, and higher-level operations.
  A faithful port of the @salesforce/b2c-tooling-sdk TypeScript SDK.
repo_url: https://github.com/SalesforceCommerceCloud/b2c-developer-tooling
repo_name: b2c-developer-tooling

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: false
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: false
            separate_signature: true
            docstring_section_style: table
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Guides:
      - Authentication: authentication.md
      - Configuration: configuration.md
      - Instance & Clients: instance-and-clients.md
      - Operations: operations.md
      - Synchronous API: sync-api.md
      - SLAS Shopper Login: slas.md
      - CLI Interoperability: cli-interop.md
  - API Reference: api-reference.md
