name: Renovate

on:
  # Run hourly to process dashboard actions (PR schedule controlled by renovate.json)
  schedule:
    - cron: '0 * * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no PRs created)'
        required: false
        default: 'false'
        type: boolean
      log_level:
        description: 'Renovate log level (debug shows underlying API errors)'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

# Renovate acts with RENOVATE_TOKEN; the GITHUB_TOKEN is only used for checkout.
permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    # RENOVATE_TOKEN lives in the renovate environment (main only), so workflows on
    # other branches can't read it.
    environment: renovate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.6
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || '' }}
