name: Deploy Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm -r run build

      - name: Download UX Studio artifacts
        run: |
          curl -fsSL https://sfcc-uxstudio.s3.amazonaws.com/uxstudio-4.5.tar.gz -o /tmp/uxstudio-4.5.tar.gz
          curl -fsSL https://sfcc-uxstudio.s3.amazonaws.com/uxstudio-4.6.tar.gz -o /tmp/uxstudio-4.6.tar.gz
          mkdir -p docs/public/uxstudio
          tar -xzf /tmp/uxstudio-4.5.tar.gz -C docs/public/uxstudio
          tar -xzf /tmp/uxstudio-4.6.tar.gz -C docs/public/uxstudio

      - name: Get latest release tag
        id: release
        run: |
          # Refresh history after any stable product release, but keep the site
          # source on the latest stable release reachable from main.
          LATEST_TAG=$(git tag --merged origin/main --list '@salesforce/*' --list 'docs@*' --sort=-creatordate |
            awk '/@[0-9]+\.[0-9]+\.[0-9]+$/ && !found {print; found=1}')
          test -n "$LATEST_TAG"

          echo "Building docs from: ${LATEST_TAG:-<none>}"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Build documentation from release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove S3-extracted uxstudio files before checkout to avoid conflicts
          rm -rf docs/public/uxstudio

          # Checkout release tag
          git checkout "$RELEASE_TAG"

          # Restore UX Studio artifacts
          rm -rf docs/public/uxstudio
          mkdir -p docs/public/uxstudio
          tar -xzf /tmp/uxstudio-4.5.tar.gz -C docs/public/uxstudio
          tar -xzf /tmp/uxstudio-4.6.tar.gz -C docs/public/uxstudio

          # Keep content, theme, and dependencies from the same release.
          pnpm install --frozen-lockfile
          pnpm -r run build
          # Older tags predate the release notes page. Once present, refresh on
          # every deployment (including docs-only releases); failures stop deploy.
          if [[ -f docs/.vitepress/releases/refresh.ts ]]; then
            pnpm --filter @salesforce/b2c-dx-docs run releases:refresh
          fi
          pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
