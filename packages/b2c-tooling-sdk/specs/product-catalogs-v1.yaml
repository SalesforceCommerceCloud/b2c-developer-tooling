components:
  schemas:
    OrganizationId:
      type: string
      pattern: ^f_ecom_[a-z]{4}_(prd|stg|dev|s[0-9]{2}|[0-9]{3})$
    Total:
      type: integer
      format: int32
      default: 0
      minimum: 0
    ResultBase:
      type: object
      properties:
        limit:
          type: integer
          format: int32
        total:
          $ref: '#/components/schemas/Total'
      required:
        - limit
        - total
    Offset:
      type: integer
      format: int32
      default: 0
      minimum: 0
    PaginatedResultBase:
      allOf:
        - $ref: '#/components/schemas/ResultBase'
      properties:
        offset:
          $ref: '#/components/schemas/Offset'
      required:
        - limit
        - offset
        - total
    SiteId:
      type: string
      maxLength: 32
      minLength: 1
    Site:
      type: object
      properties:
        cartridges:
          type: string
        customerListLink:
          type: object
          properties:
            customerListId:
              type: string
              maxLength: 256
            title:
              type: object
              additionalProperties:
                type: string
          required:
            - customerListId
        description:
          type: object
          additionalProperties:
            type: string
        displayName:
          type: object
          additionalProperties:
            type: string
        id:
          $ref: '#/components/schemas/SiteId'
        inDeletion:
          type: boolean
        storefrontStatus:
          type: string
          enum:
            - online
            - maintenance
            - to_be_deleted
            - protected
      required:
        - displayName
        - id
    CatalogId:
      type: string
      maxLength: 256
      minLength: 1
    Catalog:
      type: object
      additionalProperties:
        title: Additional Property Support
      properties:
        assignedProductCount:
          type: integer
          format: int32
        assignedSites:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        categoryCount:
          type: integer
          format: int32
        creationDate:
          type: string
          format: date-time
          maxLength: 30
        description:
          type: object
          additionalProperties:
            type: string
        id:
          $ref: '#/components/schemas/CatalogId'
        lastModified:
          type: string
          format: date-time
          maxLength: 30
        name:
          type: object
          additionalProperties:
            type: string
        online:
          type: boolean
        ownedProductCount:
          type: integer
          format: int32
        recommendationCount:
          type: integer
          format: int32
        rootCategory:
          type: string
          maxLength: 256
      required:
        - id
    Catalogs:
      allOf:
        - $ref: '#/components/schemas/PaginatedResultBase'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
      required:
        - data
        - limit
        - offset
        - total
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        title:
          type: string
          maxLength: 256
        type:
          type: string
          maxLength: 2048
        detail:
          type: string
        instance:
          type: string
          maxLength: 2048
      required:
        - detail
        - title
        - type
    Category:
      type: object
      additionalProperties:
        title: Additional Property Support
      properties:
        catalogId:
          allOf:
            - $ref: '#/components/schemas/CatalogId'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        creationDate:
          type: string
          format: date-time
          maxLength: 30
        description:
          type: object
          additionalProperties:
            type: string
        id:
          allOf:
            - $ref: '#/components/schemas/CategoryId'
        image:
          type: string
          maxLength: 256
          minLength: 1
        lastModified:
          type: string
          format: date-time
          maxLength: 30
        name:
          type: object
          additionalProperties:
            type: string
        online:
          type: boolean
        pageDescription:
          type: object
          additionalProperties:
            type: string
        pageKeywords:
          type: object
          additionalProperties:
            type: string
        pageTitle:
          type: object
          additionalProperties:
            type: string
        parentCategoryId:
          type: string
          maxLength: 256
          minLength: 1
        paths:
          type: array
          items:
            $ref: '#/components/schemas/PathRecord'
        position:
          type: number
          format: double
        sortingRules:
          type: array
          items:
            $ref: '#/components/schemas/SortingRule'
        thumbnail:
          type: string
          maxLength: 256
          minLength: 1
      required:
        - id
    CategoryId:
      type: string
      maxLength: 256
      minLength: 1
    PathRecord:
      type: object
      additionalProperties:
        title: Additional Property Support
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/CategoryId'
        name:
          type: object
          additionalProperties:
            type: string
    SortingRuleStep:
      type: object
      additionalProperties:
        title: Additional Property Support
      properties:
        attributeId:
          type: string
          maxLength: 256
        direction:
          type: string
          enum:
            - asc
            - desc
        isSystem:
          type: boolean
        position:
          type: integer
          format: int32
        textRelevanceIncluded:
          type: boolean
        typeId:
          type: string
          maxLength: 256
    SortingRule:
      type: object
      additionalProperties:
        title: Additional Property Support
      properties:
        creationDate:
          type: string
          format: date-time
          maxLength: 30
        description:
          type: string
          maxLength: 4000
        id:
          type: string
          maxLength: 256
        productSortingRuleSteps:
          type: array
          items:
            $ref: '#/components/schemas/SortingRuleStep'
        ruleContext:
          type: string
          enum:
            - site
            - global
        site:
          $ref: '#/components/schemas/SiteId'
    Categories:
      allOf:
        - $ref: '#/components/schemas/PaginatedResultBase'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
        - data
        - limit
        - offset
        - total
    Query:
      type: object
      additionalProperties: false
      maxProperties: 1
      minProperties: 1
      properties:
        boolQuery:
          $ref: '#/components/schemas/BoolQuery'
        filteredQuery:
          $ref: '#/components/schemas/FilteredQuery'
        matchAllQuery:
          $ref: '#/components/schemas/MatchAllQuery'
        nestedQuery:
          $ref: '#/components/schemas/NestedQuery'
        termQuery:
          $ref: '#/components/schemas/TermQuery'
        textQuery:
          $ref: '#/components/schemas/TextQuery'
    BoolQuery:
      type: object
      additionalProperties: false
      properties:
        must:
          type: array
          items:
            $ref: '#/components/schemas/Query'
        mustNot:
          type: array
          items:
            $ref: '#/components/schemas/Query'
        should:
          type: array
          items:
            $ref: '#/components/schemas/Query'
    Filter:
      type: object
      additionalProperties: false
      maxProperties: 1
      minProperties: 1
      properties:
        boolFilter:
          $ref: '#/components/schemas/BoolFilter'
        queryFilter:
          $ref: '#/components/schemas/QueryFilter'
        range2Filter:
          $ref: '#/components/schemas/Range2Filter'
        rangeFilter:
          $ref: '#/components/schemas/RangeFilter'
