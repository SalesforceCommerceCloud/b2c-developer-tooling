openapi: "3.0.3"
# ---------------------------------------------------------------------------
# SCAPI MRT Storefront Environments API (v1) — self-contained bundle.
#
# Source of truth: git.soma.salesforce.com/cc-mercury-api/storefront-oas
#   environments-oas/v1/api_spec/src/environments.yaml
#
# The upstream source is a multi-file spec whose $refs resolve component files
# under src/components/ plus a build-time `dependencies/commerce-cloud-standards-oas`
# folder (populated by the redocly/maven build, not committed to git). That tree
# is not directly consumable by openapi-typescript, and every other spec in this
# repo is a single self-contained file, so this file inlines the referenced
# components: the standard SCAPI `organizationId`/`storefrontId`/`environmentId`
# parameters, the RFC 7807 `ErrorResponse` envelope, and the paginated-result
# fields (`limit`/`offset`/`total`) that the upstream spec pulls in via
# `PaginatedResultBase`.
#
# Scope note: this bundle covers the environment lifecycle surface
# (list/create/clone/get/update/delete, set-primary, and cache-invalidation),
# the environment-variables sub-resource (GET + merge-PATCH), the
# access-control-headers sub-resource (list/create/get/delete), and the
# redirects sub-resource (list/create/get/update/delete and the
# `/redirects/actions/clone` action), which is what the `mrt env` lifecycle
# commands plus `mrt env var`, `mrt env access-control`, and `mrt env redirect`
# need. When bumping to a newer upstream version, re-bundle from the same source
# path.
# ---------------------------------------------------------------------------
info:
  x-api-type: Admin
  x-api-family: Storefront
  title: Environments
  version: 1.0.5
  description: >-
    SCAPI Managed Runtime Storefront Environments API. Manage the lifecycle of a
    storefront's environments (list/create/clone/get/update/delete, set the
    primary environment, and trigger CDN cache invalidations); read and update
    the environment variables for an environment (values masked, merge-PATCH
    semantics); manage the access control headers on an environment
    (list/create/get/delete; header values masked on read); and manage the URL
    redirects on an environment (list/create/get/update/delete, plus cloning all
    redirects from another environment).
servers:
  - url: "https://{shortCode}.api.commercecloud.salesforce.com/storefront/environments/v1"
    variables:
      shortCode:
        default: "123456gf"
paths:
  /organizations/{organizationId}/storefronts/{storefrontId}/environments:
    get:
      summary: Get environments for a storefront.
      description: >-
        Retrieves the list of environments belonging to the specified
        storefront, ordered by creation date in ascending order.
      operationId: getEnvironmentsForStorefront
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - name: limit
          in: query
          required: false
          description: Number of records to retrieve per request. Must be between 1 and 200. Defaults to 25.
          schema:
            type: integer
            format: int32
            default: 25
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          description: Zero-based index of the first record to include in the result.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of environments successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentResult"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments"
            - "sfcc.storefront.environments.rw"
    post:
      summary: Create an environment for a storefront.
      description: >-
        Queues creation of a new environment for the specified storefront.
        Returns immediately with the environment resource in the `building`
        status. Poll the environment by ID to track provisioning progress.
      operationId: createEnvironmentForStorefront
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCreateRequest"
      responses:
        "202":
          description: Environment creation successfully queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/clone:
    post:
      summary: Clone an environment for a storefront.
      description: >-
        Queues creation of a new environment for the specified storefront by
        cloning an existing environment. Returns immediately with the
        environment resource in the `building` status. Poll the environment by
        ID to track provisioning progress. The clone always starts as a
        non-primary environment.
      operationId: cloneEnvironmentForStorefront
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCloneRequest"
      responses:
        "202":
          description: Environment clone successfully queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}:
    get:
      summary: Get an environment by ID.
      description: Retrieves the details of a specific environment, including its current status.
      operationId: getEnvironmentById
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Environment successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments"
            - "sfcc.storefront.environments.rw"
    patch:
      summary: Update an environment.
      description: >-
        Partially updates the specified environment. Only the supplied fields
        are changed; at least one field must be provided.
      operationId: updateEnvironment
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentUpdateRequest"
      responses:
        "200":
          description: Environment successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
    delete:
      summary: Delete an environment.
      description: >-
        Queues deletion of the environment. Returns immediately with the
        environment resource in the `deleting` status. Poll the environment by
        ID to track deletion progress.
      operationId: deleteEnvironment
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      responses:
        "202":
          description: Environment deletion successfully queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/primary:
    put:
      summary: Set an environment as the storefront's primary environment.
      description: >-
        Marks the specified environment as the storefront's primary
        environment. The environment must have a status of `ready` or
        `build_failed`. Idempotent — setting an already-primary environment as
        primary again has no effect.
      operationId: setPrimaryEnvironment
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Environment successfully set as primary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/cache-invalidations:
    post:
      summary: Trigger a cache invalidation.
      description: >-
        Triggers a CDN cache invalidation on the environment for the supplied
        path prefix. Invalidation is always a wildcard operation — every cached
        path beginning with the prefix is cleared. The request is
        fire-and-forget: it returns `202 Accepted` with an empty body and no
        invalidation id to poll, and the invalidation itself is performed
        asynchronously. The environment must have an SSR bundle deployed.
      operationId: createCacheInvalidation
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheInvalidationRequest"
      responses:
        "202":
          description: Cache invalidation accepted. The invalidation is processed asynchronously; no body is returned.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/environment-variables:
    get:
      summary: Get environment variables for an environment.
      description: >-
        Retrieves the environment variables configured for the specified
        environment. Values are returned masked (only the last few characters are
        visible) and cannot be read back in plaintext.
      operationId: getEnvironmentVariables
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Environment variables successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariables"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments"
            - "sfcc.storefront.environments.rw"
    patch:
      summary: Update environment variables for an environment.
      description: >-
        Updates the environment variables using merge-PATCH semantics: a key
        present in the request is created or replaced; a key with a `null` value is
        deleted; a key omitted from the request is left unchanged. Returns 204 No
        Content on success.
      operationId: updateEnvironmentVariables
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariablesUpdateRequest"
      responses:
        "204":
          description: Environment variables successfully updated.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/access-control-headers:
    get:
      summary: Get access control headers.
      description: >-
        Retrieves a paginated list of access control headers on the environment.
        Header values are returned masked and cannot be read back in plaintext.
      operationId: getAccessControlHeaders
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
        - $ref: "#/components/parameters/accessControlHeaderOrderBy"
        - name: limit
          in: query
          required: false
          description: Number of records to retrieve per request. Must be between 1 and 200. Defaults to 25.
          schema:
            type: integer
            format: int32
            default: 25
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          description: Zero-based index of the first record to include in the result.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of access control headers successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlHeaderResult"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments"
            - "sfcc.storefront.environments.rw"
    post:
      summary: Create an access control header.
      description: >-
        Creates a header-based access control rule on the environment. The
        created value is returned masked in the response.
      operationId: createAccessControlHeader
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessControlHeaderCreateRequest"
      responses:
        "201":
          description: Access control header successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlHeader"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/access-control-headers/{accessControlHeaderId}:
    get:
      summary: Get an access control header by ID.
      description: >-
        Retrieves a single access control header by its identifier. The value is
        returned masked.
      operationId: getAccessControlHeader
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
        - $ref: "#/components/parameters/accessControlHeaderId"
      responses:
        "200":
          description: Access control header successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessControlHeader"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments"
            - "sfcc.storefront.environments.rw"
    delete:
      summary: Delete an access control header.
      description: Deletes an access control header by its identifier. Returns 204 No Content on success.
      operationId: deleteAccessControlHeader
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
        - $ref: "#/components/parameters/accessControlHeaderId"
      responses:
        "204":
          description: Access control header successfully deleted.
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/redirects:
    get:
      summary: Get redirects.
      description: Retrieves a paginated, orderable list of redirects on the environment.
      operationId: getRedirects
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
        - $ref: "#/components/parameters/redirectOrderBy"
        - name: limit
          in: query
          required: false
          description: Number of records to retrieve per request. Must be between 1 and 200. Defaults to 25.
          schema:
            type: integer
            format: int32
            default: 25
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          description: Zero-based index of the first record to include in the result.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of redirects successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedirectResult"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments"
            - "sfcc.storefront.environments.rw"
    post:
      summary: Create a redirect.
      description: Creates a redirect on the environment. Returns the created redirect.
      operationId: createRedirect
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedirectCreateRequest"
      responses:
        "201":
          description: Redirect successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redirect"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/redirects/{redirectId}:
    get:
      summary: Get a redirect by ID.
      description: Retrieves a single redirect by its identifier.
      operationId: getRedirect
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
        - $ref: "#/components/parameters/redirectId"
      responses:
        "200":
          description: Redirect successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redirect"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments"
            - "sfcc.storefront.environments.rw"
    patch:
      summary: Update a redirect.
      description: Partially updates a redirect by its identifier. Only the supplied fields are changed.
      operationId: updateRedirect
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
        - $ref: "#/components/parameters/redirectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedirectUpdateRequest"
      responses:
        "200":
          description: Redirect successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redirect"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
    delete:
      summary: Delete a redirect.
      description: Deletes a redirect by its identifier. Returns 204 No Content on success.
      operationId: deleteRedirect
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
        - $ref: "#/components/parameters/redirectId"
      responses:
        "204":
          description: Redirect successfully deleted.
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
  /organizations/{organizationId}/storefronts/{storefrontId}/environments/{environmentId}/redirects/actions/clone:
    post:
      summary: Clone redirects from a source environment.
      description: >-
        Copies all redirects from a source environment into the environment in
        the request path. The source environment must differ from the
        destination environment. Returns 201 Created with no response body.
      operationId: cloneRedirects
      parameters:
        - $ref: "#/components/parameters/organizationId"
        - $ref: "#/components/parameters/storefrontId"
        - $ref: "#/components/parameters/environmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedirectCloneRequest"
      responses:
        "201":
          description: Redirects successfully cloned into the destination environment.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
      security:
        - AmOAuth2:
            - "sfcc.storefront.environments.rw"
components:
  securitySchemes:
    AmOAuth2:
      type: oauth2
      description: AccountManager OAuth 2.0 bearer token Authentication.
      flows:
        clientCredentials:
          tokenUrl: https://account.demandware.com/dwsso/oauth2/access_token
          scopes:
            sfcc.storefront.environments: Read-only access to the Environments API.
            sfcc.storefront.environments.rw: Read and write access to the Environments API.
        authorizationCode:
          authorizationUrl: https://account.demandware.com/dwsso/oauth2/authorize
          tokenUrl: https://account.demandware.com/dwsso/oauth2/access_token
          scopes:
            sfcc.storefront.environments: Read-only access to the Environments API.
            sfcc.storefront.environments.rw: Read and write access to the Environments API.
  parameters:
    # Standard SCAPI organization identifier (inlined from
    # commerce-cloud-standards-oas). For B2C Commerce this is `f_ecom_<tenant>`.
    organizationId:
      name: organizationId
      in: path
      required: true
      style: simple
      explode: false
      description: The B2C Commerce organization identifier, e.g. `f_ecom_zzxy_prd`.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    storefrontId:
      name: storefrontId
      in: path
      required: true
      description: >-
        The storefront identifier. Must consist only of lowercase letters,
        numbers, and hyphens, with no leading or trailing hyphens.
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: "^[a-z0-9]+(?:-+[a-z0-9]+)*$"
    environmentId:
      name: environmentId
      in: path
      required: true
      description: >-
        The environment identifier. Must consist only of lowercase letters,
        numbers, and hyphens, with no leading or trailing hyphens.
      schema:
        type: string
        minLength: 1
        maxLength: 19
        pattern: "^[a-z0-9]+(?:-+[a-z0-9]+)*$"
    accessControlHeaderId:
      name: accessControlHeaderId
      in: path
      required: true
      description: The access control header identifier, in UUID format.
      schema:
        type: string
        format: uuid
    accessControlHeaderOrderBy:
      name: orderBy
      in: query
      required: false
      description: >-
        Attributes to order the returned access control headers by, in priority
        order (applied left to right). Append `:asc` or `:desc` to set the
        direction; when omitted, `:asc` is assumed. Sortable attributes:
        `creation_date`, `id`, `publishing_status`.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 3
        items:
          type: string
          pattern: "^(creation_date|id|publishing_status)(:(asc|desc))?$"
    redirectId:
      name: redirectId
      in: path
      required: true
      description: The redirect identifier, in UUID format.
      schema:
        type: string
        format: uuid
    redirectOrderBy:
      name: orderBy
      in: query
      required: false
      description: >-
        Attributes to order the returned redirects by, in priority order
        (applied left to right). Append `:asc` or `:desc` to set the direction;
        when omitted, `:asc` is assumed. Sortable attributes: `creation_date`,
        `last_modified`, `source`, `destination`, `last_modified_by`,
        `http_status_code`, `publishing_status`.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 7
        items:
          type: string
          pattern: "^(creation_date|last_modified|source|destination|last_modified_by|http_status_code|publishing_status)(:(asc|desc))?$"
  responses:
    401Unauthorized:
      description: Your access token is invalid or expired and can't be used to identify a user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    403Forbidden:
      description: You aren't authorized to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    400BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    404NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    409Conflict:
      description: >-
        The request conflicts with the current state of the resource (for
        example, deleting the primary environment, or setting an environment
        that is not `ready`/`build_failed` as primary).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    429TooManyRequests:
      description: The request was throttled by the backend rate limits. Retry later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    # Standard SCAPI RFC 7807 error envelope (inlined from commerce-cloud-standards-oas).
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        title:
          type: string
          maxLength: 256
        type:
          type: string
          maxLength: 2048
        detail:
          type: string
        instance:
          type: string
          maxLength: 2048
      required:
        - detail
        - title
        - type
    EnvironmentStatus:
      type: string
      description: The current provisioning or lifecycle status of the environment.
      enum:
        - building
        - ready
        - build_failed
        - deleting
        - deleted
        - delete_failed
      example: "ready"
    SsrRegion:
      type: string
      description: >-
        The AWS region for the server-side rendering function of the
        environment. Each value corresponds to the AWS region of the same name
        with underscores substituted for hyphens (for example, `us_east_2` is
        the AWS region `us-east-2`).
      enum:
        - us_east_1
        - us_east_2
        - us_west_1
        - us_west_2
        - ap_south_1
        - ap_south_2
        - ap_northeast_2
        - ap_southeast_1
        - ap_southeast_2
        - ap_southeast_3
        - ap_northeast_1
        - ap_northeast_3
        - ca_central_1
        - eu_central_1
        - eu_central_2
        - eu_west_1
        - eu_west_2
        - eu_west_3
        - eu_north_1
        - eu_south_1
        - sa_east_1
      example: "us_east_2"
    SsrProxyConfig:
      type: object
      description: >-
        A single proxy configuration entry for the environment, defined by its
        `path`, `host`, and `protocol`.
      additionalProperties: false
      properties:
        path:
          type: string
          description: The request path prefix routed to the proxy origin.
          maxLength: 2048
          example: "/api"
        host:
          type: string
          description: The proxy origin host.
          maxLength: 255
          example: "api.example.com"
        protocol:
          type: string
          description: The protocol used to reach the proxy origin. Only `https` is supported.
          enum:
            - https
          example: "https"
    Environment:
      description: >-
        An environment within Managed Runtime (MRT) where storefronts are
        deployed to separate phases of the development lifecycle, such as
        development, staging, or production.
      type: object
      required:
        - environmentId
        - displayName
        - status
        - isPrimary
      properties:
        environmentId:
          type: string
          description: >-
            The generated environment identifier. Unique within the storefront,
            with an auto-generated hash suffix.
          minLength: 1
          maxLength: 19
          pattern: "^[a-z0-9]+(?:-+[a-z0-9]+)*$"
          example: "production-a1b2c3d4"
        displayName:
          type: string
          description: The display name of the environment.
          maxLength: 256
          example: "Production"
        status:
          $ref: "#/components/schemas/EnvironmentStatus"
        isPrimary:
          type: boolean
          description: >-
            Indicates whether the environment is the storefront's primary
            environment. Only one environment per storefront can be primary.
          example: true
        subdomain:
          type: string
          nullable: true
          description: >-
            The subdomain assigned to this environment. Available after the
            environment finishes building and null before then.
          maxLength: 256
          example: "production"
        mrtOrigin:
          type: string
          nullable: true
          description: >-
            The Managed Runtime origin URL that backs this environment.
            Available after the environment finishes building and null before
            then.
          maxLength: 512
          example: "https://production-my-storefront.exp-delivery.com"
        defaultEcdnHostname:
          type: string
          nullable: true
          description: >-
            The eCDN hostname for the environment's default domain zone, used by
            the preview link. Available after the environment finishes building
            and null before then.
          maxLength: 256
          example: "marketstreetb82739d375a9270f.zzzz-001.my.cc.salesforce.com"
        creationDate:
          type: string
          format: date-time
          description: The timestamp when the environment was created.
          example: "2026-04-08T21:47:28.188965Z"
        lastModified:
          type: string
          format: date-time
          description: The timestamp when the environment was last modified.
          example: "2026-04-08T21:47:31.307595Z"
        ssrRegion:
          $ref: "#/components/schemas/SsrRegion"
        ssrArchitecture:
          type: string
          nullable: true
          description: >-
            The architecture for the environment's server-side rendering
            function. Null when no architecture default is configured.
          enum:
            - x86
            - arm64
          example: "arm64"
        ssrExternalHostname:
          type: string
          nullable: true
          description: >-
            The full custom hostname used by the environment (e.g.
            www.customer.com). Null when not configured.
          maxLength: 128
          example: "www.customer.com"
        ssrExternalDomain:
          type: string
          nullable: true
          description: >-
            The external domain for the ssrExternalHostname (e.g. customer.com).
            When omitted it is derived from ssrExternalHostname. Null when not
            configured.
          maxLength: 128
          example: "customer.com"
        ssrWhitelistedIps:
          type: string
          nullable: true
          description: >-
            A space-separated list of IPv4 or IPv6 CIDR blocks permitted to
            access the environment. Null or empty allows all IPs.
          maxLength: 8192
          example: "192.0.2.0/24 198.51.100.0/24"
        ssrProxyConfigs:
          type: array
          nullable: true
          description: The proxy configurations for the environment. Null when none are configured.
          maxItems: 8
          items:
            $ref: "#/components/schemas/SsrProxyConfig"
        isProduction:
          type: boolean
          description: Whether the environment is provisioned with production-tier capacity.
          example: false
        allowCookies:
          type: boolean
          description: Whether cookies are forwarded to and respected from the environment's origin.
          example: true
        preserveProxyUserAgent:
          type: boolean
          description: >-
            Whether the end-user's User-Agent header is preserved on requests
            forwarded through the environment's configured proxies.
          example: false
        enableSourceMaps:
          type: boolean
          description: Whether source maps are enabled for the environment's server-side rendering bundle.
          example: false
        logLevel:
          type: string
          nullable: true
          description: >-
            The minimum log level emitted by the environment's server-side
            rendering function. Null when inherited from the default.
          enum:
            - trace
            - debug
            - info
            - warn
            - error
            - fatal
          example: "warn"
        distributedTracing:
          type: boolean
          description: Whether distributed tracing is enabled for the environment.
          example: false
        distributedTracingSamplingRate:
          type: number
          format: double
          description: The fraction of requests sampled for distributed tracing.
          minimum: 0.0
          maximum: 1.0
          example: 0.1
        certificateId:
          type: integer
          format: int32
          nullable: true
          description: >-
            The identifier of the certificate associated with the environment's
            custom domain. Null when using the default Managed Runtime domain.
          minimum: 0
          example: 42
    EnvironmentResult:
      description: Paginated result containing a list of environments.
      type: object
      required:
        - limit
        - offset
        - total
        - data
      properties:
        limit:
          type: integer
          format: int32
          description: Maximum number of records returned per request.
          example: 25
        offset:
          type: integer
          format: int32
          description: Zero-based index of the first record included in the result.
          example: 0
        total:
          type: integer
          format: int32
          description: Total number of environments matching the request.
          example: 3
        data:
          type: array
          description: The list of environments belonging to the storefront. May be empty.
          items:
            $ref: "#/components/schemas/Environment"
    EnvironmentCreateRequest:
      description: Request body to create an environment for a storefront.
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: The display name for the new environment.
          maxLength: 256
          example: "Production"
    EnvironmentUpdateRequest:
      description: >-
        Request body to update an environment. Every field is optional and only
        the supplied fields are changed; at least one field must be provided.
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          description: The new display name for the environment.
          maxLength: 256
          example: "Production"
        ssrRegion:
          $ref: "#/components/schemas/SsrRegion"
        ssrArchitecture:
          type: string
          nullable: true
          description: >-
            The architecture for the environment's server-side rendering
            function. Set to null to inherit the storefront default.
          enum:
            - x86
            - arm64
          example: "arm64"
        ssrExternalHostname:
          type: string
          nullable: true
          description: >-
            The full custom hostname used by the environment (e.g.
            www.customer.com). Set to null to clear it.
          maxLength: 128
          example: "www.customer.com"
        ssrExternalDomain:
          type: string
          nullable: true
          description: >-
            The external domain for the ssrExternalHostname (e.g. customer.com).
            When omitted it is derived from ssrExternalHostname. Set to null to
            clear it.
          maxLength: 128
          example: "customer.com"
        ssrWhitelistedIps:
          type: string
          nullable: true
          description: >-
            A space-separated list of IPv4 or IPv6 CIDR blocks permitted to
            access the environment. Set to null or empty to allow all IPs.
          maxLength: 8192
          example: "192.0.2.0/24 198.51.100.0/24"
        ssrProxyConfigs:
          type: array
          nullable: true
          description: The proxy configurations for the environment. Set to null to clear them.
          maxItems: 8
          items:
            $ref: "#/components/schemas/SsrProxyConfig"
        isProduction:
          type: boolean
          description: Whether the environment is provisioned with production-tier capacity.
          example: false
        allowCookies:
          type: boolean
          description: Whether cookies are forwarded to and respected from the environment's origin.
          example: true
        preserveProxyUserAgent:
          type: boolean
          description: >-
            Whether the end-user's User-Agent header is preserved on requests
            forwarded through the environment's configured proxies.
          example: false
        enableSourceMaps:
          type: boolean
          description: Whether source maps are enabled for the environment's server-side rendering bundle.
          example: false
        logLevel:
          type: string
          nullable: true
          description: >-
            The minimum log level emitted by the environment's server-side
            rendering function. Set to null to inherit the default.
          enum:
            - trace
            - debug
            - info
            - warn
            - error
            - fatal
          example: "warn"
        distributedTracing:
          type: boolean
          description: Whether distributed tracing is enabled for the environment.
          example: false
        distributedTracingSamplingRate:
          type: number
          format: double
          description: The fraction of requests sampled for distributed tracing.
          minimum: 0.0
          maximum: 1.0
          example: 0.1
        certificateId:
          type: integer
          format: int32
          nullable: true
          description: >-
            The identifier of the certificate to associate with the
            environment's custom domain. Set to null to remove the certificate
            association. Not permitted when using the default Managed Runtime
            domain.
          minimum: 0
          example: 42
    EnvironmentCloneRequest:
      description: Request body to create an environment by cloning an existing one.
      type: object
      required:
        - sourceEnvironmentId
        - displayName
      properties:
        sourceEnvironmentId:
          type: string
          description: The identifier of the environment to clone.
          minLength: 1
          maxLength: 19
          pattern: "^[a-z0-9]+(?:-+[a-z0-9]+)*$"
          example: "production-a1b2c3d4"
        displayName:
          type: string
          description: The display name for the new environment.
          maxLength: 256
          example: "Production (EU)"
        cloneEnvironmentVariables:
          type: boolean
          description: Whether to copy the source environment's environment variables to the new environment.
          default: false
          example: true
        cloneRedirects:
          type: boolean
          description: Whether to copy the source environment's redirects to the new environment.
          default: false
          example: true
        cloneB2cTargetInfo:
          type: boolean
          description: Whether to copy the source environment's B2C Commerce target information to the new environment.
          default: true
          example: true
    CacheInvalidationRequest:
      description: Request body to trigger a CDN cache invalidation on the environment.
      type: object
      required:
        - pattern
      properties:
        pattern:
          type: string
          description: >-
            The path prefix to invalidate. Must start with `/`. Cache
            invalidation is always a wildcard operation: the CDN clears every
            cached path that begins with this value (a trailing `*` is always
            implied), so `/products` and `/products*` invalidate the same paths.
            If the value contains a `*`, only the portion before the first `*`
            is used as the prefix and the remainder is ignored. The invalidation
            is performed asynchronously.
          minLength: 1
          pattern: "^/.*$"
          example: "/products/*"
    PublishingStatus:
      type: string
      description: The publishing status of an environment variable.
      enum:
        - pending
        - completed
        - failed
      example: "completed"
    EnvironmentVariableEntry:
      description: A single environment variable's masked value and metadata.
      type: object
      properties:
        value:
          type: string
          nullable: true
          description: >-
            The masked value of the environment variable (only the last few
            characters are visible). Null if no value is set.
          maxLength: 32768
          example: "****cret"
        createdBy:
          type: string
          nullable: true
          description: The email address of the user who created the variable. Null if no user is associated.
          maxLength: 254
          example: "dev@example.com"
        creationDate:
          type: string
          format: date-time
          description: The timestamp when the variable was created.
          example: "2026-04-08T21:47:28.188965Z"
        lastModified:
          type: string
          format: date-time
          description: The timestamp when the variable was last modified.
          example: "2026-04-08T21:47:31.307595Z"
        lastModifiedBy:
          type: string
          nullable: true
          description: The email address of the user who last modified the variable. Null if no user is associated.
          maxLength: 254
          example: "dev@example.com"
        publishingStatus:
          $ref: "#/components/schemas/PublishingStatus"
    EnvironmentVariables:
      description: >-
        The environment variables for an environment, keyed by variable name. Each
        value is an {@link EnvironmentVariableEntry} with a masked value and metadata.
      type: object
      additionalProperties:
        $ref: "#/components/schemas/EnvironmentVariableEntry"
    EnvironmentVariableUpdateEntry:
      description: >-
        A single environment variable update. A `null` value deletes the variable;
        a string or number value creates or replaces it.
      type: object
      required:
        - value
      properties:
        value:
          nullable: true
          description: The new value for the variable, or `null` to delete it.
          oneOf:
            - type: string
              maxLength: 32768
            - type: number
    EnvironmentVariablesUpdateRequest:
      description: >-
        Merge-PATCH request body, keyed by variable name. Present keys are
        created/replaced, keys with a `null` value are deleted, and omitted keys are
        left unchanged.
      type: object
      additionalProperties:
        $ref: "#/components/schemas/EnvironmentVariableUpdateEntry"
    AccessControlHeader:
      description: A header-based access control rule on the environment.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the access control header, in UUID format.
          example: "ff832a9e-0e55-11ef-8f23-0242ac110002"
        value:
          type: string
          description: The masked header value. Actual values are never returned in clear text.
          maxLength: 127
          example: "****************by0z"
        createdBy:
          type: string
          nullable: true
          description: The email address of the user who created the header. Null if no user is associated.
          maxLength: 255
          example: "dev@example.com"
        creationDate:
          type: string
          format: date-time
          description: The timestamp when the header was created.
          example: "2026-08-24T09:23:28.872916Z"
        publishingStatus:
          $ref: "#/components/schemas/PublishingStatus"
    AccessControlHeaderResult:
      description: Paginated result containing a list of access control headers.
      type: object
      required:
        - limit
        - offset
        - total
        - data
      properties:
        limit:
          type: integer
          format: int32
          description: Maximum number of records returned per request.
          example: 25
        offset:
          type: integer
          format: int32
          description: Zero-based index of the first record included in the result.
          example: 0
        total:
          type: integer
          format: int32
          description: Total number of access control headers matching the request.
          example: 3
        data:
          type: array
          description: The list of access control headers. May be empty.
          items:
            $ref: "#/components/schemas/AccessControlHeader"
    AccessControlHeaderCreateRequest:
      description: Request body to create an access control header.
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: The header value.
          minLength: 9
          maxLength: 127
          example: "jfoWikeaby0z"
    RedirectHttpStatusCode:
      type: integer
      format: int32
      description: The HTTP status code returned for the redirect.
      enum:
        - 301
        - 302
      default: 301
      example: 301
    Redirect:
      description: A URL redirect rule on the environment.
      type: object
      properties:
        redirectId:
          type: string
          format: uuid
          description: The unique identifier of the redirect, in UUID format.
          example: "3f9b1c2d-4e5f-6a7b-8c9d-0e1f2a3b4c5d"
        source:
          type: string
          description: The source path that triggers the redirect.
          minLength: 1
          maxLength: 2000
          example: "/spring"
        destination:
          type: string
          description: The destination path or URL the request is redirected to.
          minLength: 1
          maxLength: 2000
          example: "/summer-newbranding"
        httpStatusCode:
          $ref: "#/components/schemas/RedirectHttpStatusCode"
        forwardQuerystring:
          type: boolean
          description: Whether the incoming query string is forwarded to the destination.
          example: false
        forwardWildcard:
          type: boolean
          description: Whether a trailing wildcard match on the source is forwarded to the destination.
          example: false
        publishingStatus:
          $ref: "#/components/schemas/PublishingStatus"
        createdBy:
          type: string
          nullable: true
          description: The email address of the user who created the redirect. Null if no user is associated.
          maxLength: 255
          example: "dev@example.com"
        lastModifiedBy:
          type: string
          nullable: true
          description: The email address of the user who last modified the redirect. Null if no user is associated.
          maxLength: 255
          example: "dev@example.com"
        creationDate:
          type: string
          format: date-time
          description: The timestamp when the redirect was created.
          example: "2026-08-24T00:00:00.000Z"
        lastModified:
          type: string
          format: date-time
          description: The timestamp when the redirect was last modified.
          example: "2026-08-24T00:00:00.000Z"
    RedirectResult:
      description: Paginated result containing a list of redirects.
      type: object
      required:
        - limit
        - offset
        - total
        - data
      properties:
        limit:
          type: integer
          format: int32
          description: Maximum number of records returned per request.
          example: 25
        offset:
          type: integer
          format: int32
          description: Zero-based index of the first record included in the result.
          example: 0
        total:
          type: integer
          format: int32
          description: Total number of redirects matching the request.
          example: 3
        data:
          type: array
          description: The list of redirects. May be empty.
          items:
            $ref: "#/components/schemas/Redirect"
    RedirectCreateRequest:
      description: Request body to create a single redirect.
      type: object
      required:
        - source
        - destination
      properties:
        source:
          type: string
          description: The source path that triggers the redirect.
          minLength: 1
          maxLength: 2000
          example: "/spring"
        destination:
          type: string
          description: The destination path or URL the request is redirected to.
          minLength: 1
          maxLength: 2000
          example: "/summer-newbranding"
        httpStatusCode:
          $ref: "#/components/schemas/RedirectHttpStatusCode"
        forwardQuerystring:
          type: boolean
          description: Whether the incoming query string is forwarded to the destination.
          default: false
          example: false
        forwardWildcard:
          type: boolean
          description: Whether a trailing wildcard match on the source is forwarded to the destination.
          default: false
          example: false
    RedirectUpdateRequest:
      description: Request body to partially update a redirect. Only the supplied fields are changed.
      type: object
      minProperties: 1
      properties:
        source:
          type: string
          description: The source path that triggers the redirect.
          minLength: 1
          maxLength: 2000
          example: "/spring"
        destination:
          type: string
          description: The destination path or URL the request is redirected to.
          minLength: 1
          maxLength: 2000
          example: "/summer-2027"
        httpStatusCode:
          $ref: "#/components/schemas/RedirectHttpStatusCode"
        forwardQuerystring:
          type: boolean
          description: Whether the incoming query string is forwarded to the destination.
          example: false
        forwardWildcard:
          type: boolean
          description: Whether a trailing wildcard match on the source is forwarded to the destination.
          example: false
    RedirectCloneRequest:
      description: Request body to clone all redirects from a source environment into this environment.
      type: object
      required:
        - sourceEnvironmentId
      properties:
        sourceEnvironmentId:
          type: string
          description: >-
            The identifier of the environment to copy redirects from. Must
            differ from the environment in the request path.
          minLength: 1
          maxLength: 19
          pattern: "^[a-z0-9]+(?:-+[a-z0-9]+)*$"
          example: "staging"
